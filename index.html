  <body>
    <!-- Splash Screen — shown until fonts are loaded -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f5f7fa;flex-direction:column;gap:12px;">
      <div style="width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:#0050d5;border-radius:50%;animation:spin .7s linear infinite;"></div>
      <span style="font-family:sans-serif;font-size:13px;color:#74777a;">Loading…</span>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        var s = document.getElementById('splash');
        s.style.background = '#1a1a2e';
        s.querySelector('span').style.color = '#a0a3a6';
        var d = s.querySelector('div');
        d.style.borderColor = '#505358';
        d.style.borderTopColor = '#618bff';
      }
    </script>
    <div id="root"></div>
  </body>
